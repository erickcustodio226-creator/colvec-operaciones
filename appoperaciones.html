<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLVEC C&M - Operaciones</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <!-- Firebase SDKs CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.firebaseApp = { initializeApp, getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, getFirestore, collection, addDoc, getDocs, doc, updateDoc };
    </script>

    <script type="text/babel">
        // --- CONFIGURACIÓN DE FIREBASE (TUS LLAVES) ---
        const firebaseConfig = {
          apiKey: "TU_API_KEY",
          authDomain: "colvec-operaciones.firebaseapp.com",
          projectId: "colvec-operaciones",
          storageBucket: "colvec-operaciones.appspot.com",
          messagingSenderId: "TU_MESSAGING_SENDER_ID",
          appId: "TU_APP_ID"
        };

        let app, auth, db;
        try {
            app = window.firebaseApp.initializeApp(firebaseConfig);
            auth = window.firebaseApp.getAuth(app);
            db = window.firebaseApp.getFirestore(app);
        } catch (e) {
            console.log("Firebase en modo local/simulación", e);
        }

        function App() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('home');
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');

            const [tareos, setTareos] = React.useState([
                { id: 1, trabajador: 'Juan Pérez', cargo: 'Operario', lunes: 8, martes: 8, miercoles: 8, jueves: 8, viernes: 8, sabado: 5, domingoCalc: 'Completado' },
                { id: 2, trabajador: 'Carlos Ruiz', cargo: 'Oficial', lunes: 8, martes: 8, miercoles: 8, jueves: 8, viernes: 8, sabado: 4, domingoCalc: 'Completado' }
            ]);

            const [gastos, setGastos] = React.useState([
                { id: 1, descripcion: 'Compra de EPPs y cascos', monto: 450.00, proyecto: 'Hidrandina - Mantenimiento', supervisor: 'Erick Custodio', estado: 'Pendiente Gerencia' },
                { id: 2, descripcion: 'Alquiler de camioneta 4x4', monto: 1200.00, proyecto: 'Municipalidad Provincial', supervisor: 'Supervisor 1', estado: 'Aprobado' }
            ]);

            const [proyectos, setProyectos] = React.useState([
                { id: 1, nombre: 'Mantenimiento Redes Hidrandina', entidad: 'Hidrandina S.A.', avance: 75, estadoSemaforo: '🟢 En Plazo', fechaLimite: '2026-09-30' },
                { id: 2, nombre: 'Instalación de Tableros Eléctricos', entidad: 'Municipalidad Chimbote', avance: 40, estadoSemaforo: '🟡 Atención', fechaLimite: '2026-09-18' }
            ]);

            const [activos, setActivos] = React.useState([
                { id: 1, codigo: 'ACT-001', nombre: 'Megóhmetro Digital Fluke', asignadoA: 'Juan Pérez', estado: 'Operativo' },
                { id: 2, codigo: 'ACT-002', nombre: 'Rotomartillo Bosch Professional', asignadoA: 'Carlos Ruiz', estado: 'En Mantenimiento' }
            ]);

            const handleLogin = (e) => {
                e.preventDefault();
                setError('');
                if (email && password) {
                    setUser({ email });
                } else {
                    setError('Por favor ingrese correo y contraseña.');
                }
            };

            const handleLogout = () => {
                setUser(null);
            };

            const aprobarGasto = (id) => {
                setGastos(gastos.map(g => g.id === id ? { ...g, estado: 'Aprobado' } : g));
            };

            if (!user) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-900 to-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
                            <div className="text-center mb-8">
                                <div className="bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold shadow-lg">
                                    C&M
                                </div>
                                <h1 className="text-2xl font-bold text-gray-900">COLVEC C&M</h1>
                                <p className="text-sm text-gray-500 mt-1">Plataforma de Control Operativo y Gerencial</p>
                            </div>
                            {error && <div className="bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-4 border border-red-200">{error}</div>}
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                                    <input 
                                        type="email" 
                                        required
                                        value={email} 
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="usuario@colvec.com"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                                    <input 
                                        type="password" 
                                        required
                                        value={password} 
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="••••••••"
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                    />
                                </div>
                                <button 
                                    type="submit"
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md"
                                >
                                    Ingresar al Sistema
                                </button>
                            </form>
                            <p className="text-xs text-center text-gray-400 mt-6">Acceso exclusivo para supervisores y socios autorizados.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col">
                    <header className="bg-blue-900 text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-blue-700 p-2 rounded-lg font-bold text-lg">C&M</div>
                                <div>
                                    <h1 className="font-bold text-lg leading-tight">COLVEC C&M Operaciones</h1>
                                    <p className="text-xs text-blue-200">Panel Integral de Control</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-4">
                                <span className="text-sm bg-blue-800 px-3 py-1 rounded-full hidden sm:inline-block">👤 {user.email}</span>
                                <button 
                                    onClick={handleLogout}
                                    className="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition"
                                >
                                    Salir
                                </button>
                            </div>
                        </div>

                        <div className="bg-blue-950 px-4 overflow-x-auto">
                            <div className="max-w-7xl mx-auto flex space-x-2 py-2">
                                {[
                                    { id: 'home', label: 'Inicio', icon: 'fa-house' },
                                    { id: 'tareo', label: 'Tareo & Asistencia', icon: 'fa-users-clock' },
                                    { id: 'gastos', label: 'Gastos & Flujo', icon: 'fa-wallet' },
                                    { id: 'proyectos', label: 'Proyectos & Entidades', icon: 'fa-diagram-project' },
                                    { id: 'activos', label: 'Control Activos', icon: 'fa-toolbox' }
                                ].map((tab) => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition ${
                                            activeTab === tab.id ? 'bg-blue-600 text-white shadow' : 'text-gray-300 hover:bg-blue-900 hover:text-white'
                                        }`}
                                    >
                                        <i className={`fa-solid ${tab.icon}`}></i>
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
                        {activeTab === 'home' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                        <p className="text-sm text-gray-500 font-medium">Proyectos Activos</p>
                                        <h3 className="text-3xl font-bold text-gray-900 mt-1">2</h3>
                                        <span className="text-xs text-green-600 font-semibold mt-2 inline-block">🟢 100% en plazos</span>
                                    </div>
                                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                        <p className="text-sm text-gray-500 font-medium">Gastos del Mes (S/)</p>
                                        <h3 className="text-3xl font-bold text-blue-600 mt-1">S/ 1,650.00</h3>
                                        <span className="text-xs text-amber-600 font-semibold mt-2 inline-block">⏳ 1 Pendiente de Aprobación</span>
                                    </div>
                                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                        <p className="text-sm text-gray-500 font-medium">Personal en Campo</p>
                                        <h3 className="text-3xl font-bold text-gray-900 mt-1">12</h3>
                                        <span className="text-xs text-blue-600 font-semibold mt-2 inline-block">✓ Asistencia registrada</span>
                                    </div>
                                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                        <p className="text-sm text-gray-500 font-medium">Cálculo Dominical</p>
                                        <h3 className="text-3xl font-bold text-green-600 mt-1">Automático</h3>
                                        <span className="text-xs text-gray-500 mt-2 inline-block">Basado en Lun-Sáb</span>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                    <h3 className="text-lg font-bold text-gray-900 mb-4">Acceso Rápido a Operaciones</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <button onClick={() => setActiveTab('tareo')} className="p-4 bg-blue-50 hover:bg-blue-100 rounded-xl text-left transition border border-blue-100">
                                            <i className="fa-solid fa-users-clock text-blue-600 text-xl mb-2"></i>
                                            <h4 className="font-bold text-blue-900">Registrar Tareo</h4>
                                            <p className="text-xs text-blue-700 mt-1">Control diario de asistencia y horas extra.</p>
                                        </button>
                                        <button onClick={() => setActiveTab('gastos')} className="p-4 bg-emerald-50 hover:bg-emerald-100 rounded-xl text-left transition border border-emerald-100">
                                            <i className="fa-solid fa-wallet text-emerald-600 text-xl mb-2"></i>
                                            <h4 className="font-bold text-emerald-900">Aprobar Gastos</h4>
                                            <p className="text-xs text-emerald-700 mt-1">Flujo de revisión y desembolso operativo.</p>
                                        </button>
                                        <button onClick={() => setActiveTab('proyectos')} className="p-4 bg-amber-50 hover:bg-amber-100 rounded-xl text-left transition border border-amber-100">
                                            <i className="fa-solid fa-diagram-project text-amber-600 text-xl mb-2"></i>
                                            <h4 className="font-bold text-amber-900">Estado Hidrandina / Muni</h4>
                                            <p className="text-xs text-amber-700 mt-1">Seguimiento de cartas y plazos críticos.</p>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'tareo' && (
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <div>
                                        <h2 className="text-xl font-bold text-gray-900">Tareo y Control de Asistencia</h2>
                                        <p className="text-sm text-gray-500">Cálculo automático dominical basado en el récord de lunes a sábado.</p>
                                    </div>
                                    <button className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                                        + Nuevo Trabajador
                                    </button>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-gray-100 text-gray-700 text-sm">
                                                <th className="p-3">Trabajador</th>
                                                <th className="p-3">Cargo</th>
                                                <th className="p-3 text-center">Lun</th>
                                                <th className="p-3 text-center">Mar</th>
                                                <th className="p-3 text-center">Mié</th>
                                                <th className="p-3 text-center">Jue</th>
                                                <th className="p-3 text-center">Vie</th>
                                                <th className="p-3 text-center">Sáb</th>
                                                <th className="p-3 text-center">Domingo (Auto)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-200 text-sm">
                                            {tareos.map((t) => (
                                                <tr key={t.id} className="hover:bg-gray-50">
                                                    <td className="p-3 font-semibold text-gray-900">{t.trabajador}</td>
                                                    <td className="p-3 text-gray-600">{t.cargo}</td>
                                                    <td className="p-3 text-center">{t.lunes}h</td>
                                                    <td className="p-3 text-center">{t.martes}h</td>
                                                    <td className="p-3 text-center">{t.miercoles}h</td>
                                                    <td className="p-3 text-center">{t.jueves}h</td>
                                                    <td className="p-3 text-center">{t.viernes}h</td>
                                                    <td className="p-3 text-center">{t.sabado}h</td>
                                                    <td className="p-3 text-center font-bold text-green-600 bg-green-50 rounded">Pagado (Completo)</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'gastos' && (
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <div>
                                        <h2 className="text-xl font-bold text-gray-900">Gestión de Gastos y Flujo</h2>
                                        <p className="text-sm text-gray-500">Sistema de doble aprobación para control gerencial.</p>
                                    </div>
                                    <button className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                                        + Registrar Gasto
                                    </button>
                                </div>
                                <div className="space-y-4">
                                    {gastos.map((g) => (
                                        <div key={g.id} className="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 border border-gray-200 rounded-xl hover:shadow-md transition">
                                            <div>
                                                <h4 className="font-bold text-gray-900">{g.descripcion}</h4>
                                                <p className="text-xs text-gray-500 mt-1">Proyecto: <span className="font-semibold">{g.proyecto}</span> | Supervisor: {g.supervisor}</p>
                                            </div>
                                            <div className="mt-3 sm:mt-0 flex items-center space-x-4">
                                                <span className="text-lg font-bold text-blue-600">S/ {g.monto.toFixed(2)}</span>
                                                <span className={`px-3 py-1 rounded-full text-xs font-semibold ${g.estado === 'Aprobado' ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}`}>
                                                    {g.estado}
                                                </span>
                                                {g.estado === 'Pendiente Gerencia' && (
                                                    <button onClick={() => aprobarGasto(g.id)} className="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs font-bold transition">
                                                        Aprobar
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'proyectos' && (
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <div>
                                        <h2 className="text-xl font-bold text-gray-900">Seguimiento de Proyectos y Entidades</h2>
                                        <p className="text-sm text-gray-500">Control de plazos con semáforo y estatus ante Hidrandina / Municipalidades.</p>
                                    </div>
                                    <button className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                                        + Nuevo Proyecto
                                    </button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {proyectos.map((p) => (
                                        <div key={p.id} className="border border-gray-200 rounded-xl p-5 shadow-sm">
                                            <div className="flex justify-between items-start mb-3">
                                                <h4 className="font-bold text-gray-900">{p.nombre}</h4>
                                                <span className="px-2.5 py-1 bg-gray-100 rounded text-xs font-semibold">{p.entidad}</span>
                                            </div>
                                            <div className="mb-3">
                                                <div className="flex justify-between text-xs text-gray-600 mb-1">
                                                    <span>Avance</span>
                                                    <span>{p.avance}%</span>
                                                </div>
                                                <div className="w-full bg-gray-200 rounded-full h-2.5">
                                                    <div className="bg-blue-600 h-2.5 rounded-full" style={{ width: `${p.avance}%` }}></div>
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-center text-xs mt-4 pt-3 border-t border-gray-100">
                                                <span className="font-medium text-gray-500">Límite: {p.fechaLimite}</span>
                                                <span className="font-bold px-2 py-1 rounded bg-gray-50">{p.estadoSemaforo}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'activos' && (
                            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <div>
                                        <h2 className="text-xl font-bold text-gray-900">Control de Activos y Asignación</h2>
                                        <p className="text-sm text-gray-500">Responsabilidad de herramientas y equipos por personal.</p>
                                    </div>
                                    <button className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                                        + Registrar Activo
                                    </button>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-gray-100 text-gray-700 text-sm">
                                                <th className="p-3">Código</th>
                                                <th className="p-3">Descripción del Activo</th>
                                                <th className="p-3">Asignado a Responsable</th>
                                                <th className="p-3">Estado</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-200 text-sm">
                                            {activos.map((a) => (
                                                <tr key={a.id} className="hover:bg-gray-50">
                                                    <td className="p-3 font-mono font-semibold text-blue-600">{a.codigo}</td>
                                                    <td className="p-3 font-medium text-gray-900">{a.nombre}</td>
                                                    <td className="p-3 text-gray-600">{a.asignadoA}</td>
                                                    <td className="p-3">
                                                        <span className={`px-2 py-1 rounded text-xs font-semibold ${a.estado === 'Operativo' ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}`}>
                                                            {a.estado}
                                                        </span>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
