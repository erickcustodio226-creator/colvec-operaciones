<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLVEC C&M | Gestión Documental y Operaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Principal -->
    <div id="app" class="w-full max-w-md">
        
        <!-- VISTA DE LOGIN Y CREAR USUARIO -->
        <div id="auth-container" class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-600 text-white mb-3 shadow-lg text-xl">
                    🏢
                </div>
                <h1 class="text-2xl font-bold text-slate-900">COLVEC C&M</h1>
                <p class="text-sm text-slate-500">Gestión Documental y Operaciones</p>
            </div>

            <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg"></div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                
                <button type="submit" id="submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition duration-200 shadow-md text-sm">
                    Iniciar Sesión
                </button>
            </form>

            <div class="mt-6 text-center">
                <button id="toggle-mode" class="text-xs text-blue-600 hover:underline font-medium">
                    ¿No tienes cuenta? Regístrate aquí
                </button>
            </div>
        </div>

        <!-- VISTA DEL PANEL (DASHBOARD) - Oculta hasta iniciar sesión -->
        <div id="dashboard-container" class="hidden bg-white rounded-2xl shadow-2xl p-8">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Panel de Operaciones</h2>
                    <p class="text-xs text-slate-500" id="user-email-display"></p>
                </div>
                <button id="logout-btn" class="px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold rounded-lg transition">
                    Salir
                </button>
            </div>
            
            <div class="space-y-4 text-center">
                <div class="p-4 bg-blue-50 border border-blue-100 rounded-xl text-left">
                    <h3 class="font-bold text-blue-900 text-sm mb-1">¡Conectado exitosamente!</h3>
                    <p class="text-xs text-blue-700">Tu sistema ya está vinculado a Firebase Hosting y Auth.</p>
                </div>
                
                <div class="p-6 border border-slate-200 rounded-xl">
                    <p class="text-sm text-slate-600 mb-3">Aquí puedes registrar tus cartas y documentos de COLVEC.</p>
                    <button onclick="alert('¡Módulo listo para registrar operaciones!')" class="w-full py-3 bg-slate-900 text-white text-xs font-medium rounded-lg hover:bg-slate-800 transition shadow">
                        + Nueva Carta u Operación
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- CÓDIGO DE FIREBASE Y FUNCIONALIDAD -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Tus llaves correctas de Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyB80H5vQs7OrVdPNidN_h_68TweJH-P6rI",
          authDomain: "colvec-operaciones.firebaseapp.com",
          projectId: "colvec-operaciones",
          storageBucket: "colvec-operaciones.appspot.com",
          messagingSenderId: "745332416981",
          appId: "1:745332416981:web:12cd58e3b448c9e7a6dd5c",
          measurementId: "G-8T9CRMB851"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isRegistering = false;

        const authForm = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const toggleModeBtn = document.getElementById('toggle-mode');
        const errorMsg = document.getElementById('error-msg');
        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const userEmailDisplay = document.getElementById('user-email-display');
        const logoutBtn = document.getElementById('logout-btn');

        // Alternar entre iniciar sesión y registrarse
        toggleModeBtn.addEventListener('click', () => {
            isRegistering = !isRegistering;
            if (isRegistering) {
                submitBtn.textContent = 'Crear Cuenta';
                toggleModeBtn.textContent = '¿Ya tienes cuenta? Inicia Sesión';
            } else {
                submitBtn.textContent = 'Iniciar Sesión';
                toggleModeBtn.textContent = '¿No tienes cuenta? Regístrate aquí';
            }
            errorMsg.classList.add('hidden');
        });

        // Manejar el botón de Enviar (Login o Registro)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                if (isRegistering) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                errorMsg.textContent = "Error: " + error.message;
                errorMsg.classList.remove('hidden');
            }
        });

        // Controlar pantallas según si hay sesión iniciada
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;
            } else {
                dashboardContainer.classList.add('hidden');
                authContainer.classList.remove('hidden');
                emailInput.value = '';
                passwordInput.value = '';
            }
        });

        // Cerrar sesión
        logoutBtn.addEventListener('click', async () => {
            await signOut(auth);
        });
    </script>
</body>
</html>
